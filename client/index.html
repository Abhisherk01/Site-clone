<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Meridian — Digital studio for strategy, design &amp; engineering</title>
    <meta
      name="description"
      content="Meridian ships products end to end — strategy, design and engineering under one roof. From first call to first release in weeks, not quarters."
    />

    <!-- Browser UI color. Initial value = dark theme; the no-flash script below
         corrects it before first paint, ThemeContext keeps it in sync on toggle. -->
    <meta name="theme-color" content="#0e100f" />

    <!-- Open Graph / Twitter. TODO (Step 18): og:image (1200×630 PNG at the final
         domain), og:url, and switch twitter:card to summary_large_image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meridian" />
    <meta property="og:title" content="Meridian — Digital studio" />
    <meta
      property="og:description"
      content="Strategy, design and engineering under one roof. From first call to first release in weeks, not quarters."
    />
    <meta property="og:url" content="https://site-clone-production.up.railway.app/" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- TODO (Step 18): replace meridian.example with the final domain.
         Validate after editing: https://validator.schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Meridian",
        "description": "Digital studio shipping products end to end — strategy, design and engineering under one roof.",
        "url": "https://meridian.example",
        "email": "hello@meridian.studio"
      }
    </script>

    <!-- Theme no-flash: must match getInitialTheme() in src/context/ThemeContext.jsx.
         Also sets theme-color so the browser UI is correct at first paint. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("meridian-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "light" ? "#f6f8f6" : "#0e100f");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
