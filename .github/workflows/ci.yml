# CI — build + lint + API smoke tests on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install deps (root, client, server)
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
      - name: Build (root script owns the client build)
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps + Prisma engines
        run: |
          npm ci
          npx prisma generate
        working-directory: server
      - name: API smoke tests (throwaway SQLite)
        run: npm test
        working-directory: server